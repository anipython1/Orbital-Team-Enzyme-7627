# Render Blueprint for FindMyFYP.
# Deploy: push to GitHub, then Render Dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file and creates both services below.

services:
  # ---------------------------------------------------------------------------
  # FastAPI backend (Python web service).
  # Uses a persistent disk so the SQLite database survives redeploys.
  # NOTE: persistent disks require a paid instance (plan: starter, ~$7/mo).
  # ---------------------------------------------------------------------------
  - type: web
    name: findmyfyp-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: findmyfyp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DB_PATH
        value: /var/data/findmyfyp.db
      # Set this to the frontend's URL after the first deploy
      # (e.g. https://findmyfyp-frontend.onrender.com).
      - key: FRONTEND_URL
        sync: false

  # ---------------------------------------------------------------------------
  # React + Vite frontend (static site, always free).
  # The rewrite rule makes client-side routing (react-router) work on refresh.
  # ---------------------------------------------------------------------------
  - type: web
    name: findmyfyp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to the backend's URL + /api after the first deploy
      # (e.g. https://findmyfyp-backend.onrender.com/api).
      - key: VITE_API_URL
        sync: false
